
name: Sync Actual upstream

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actual-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream \
            https://github.com/actualbudget/actual.git
          git fetch upstream master

      - name: Merge upstream changes
        run: |
          git merge --no-edit upstream/master

      - name: Push updated master
        run: |
          git push origin HEAD:master

      - name: Merge master into Net Worth branch
        run: |
          git fetch origin feature/net-worth-breakdown
          git switch -C feature/net-worth-breakdown origin/feature/net-worth-breakdown
          git merge --no-edit master

      - name: Push updated Net Worth branch
        run: |
          git push origin HEAD:feature/net-worth-breakdown

